<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Government Schemes</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f4f7fb;
            color: #243047;
        }

        .scheme-container {
            width: 92%;
            max-width: 1200px;
            margin: 35px auto;
        }

        .scheme-header {
            text-align: center;
            margin-bottom: 25px;
        }

        .scheme-header h1 {
            color: #173b70;
            font-size: 32px;
            margin-bottom: 10px;
        }

        .scheme-header p {
            color: #65738a;
            font-size: 15px;
        }

        .scheme-filters {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            margin-bottom: 20px;
        }

        .scheme-filters input,
        .scheme-filters select {
            flex: 1;
            min-width: 180px;
            padding: 13px;
            border: 1px solid #ccd5e2;
            border-radius: 8px;
            background: white;
            font-size: 14px;
        }

        .scheme-count {
            margin-bottom: 18px;
            color: #52627a;
            font-size: 14px;
        }

        .scheme-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
            gap: 20px;
        }

        .scheme-card {
            background: white;
            padding: 22px;
            border-radius: 12px;
            border: 1px solid #e1e7ef;
            box-shadow: 0 3px 12px rgba(0, 0, 0, 0.05);
        }

        .scheme-card h3 {
            color: #173b70;
            font-size: 19px;
            margin-bottom: 12px;
        }

        .scheme-tag {
            display: inline-block;
            background: #e7f0ff;
            color: #24579b;
            padding: 6px 10px;
            border-radius: 20px;
            font-size: 12px;
            margin-bottom: 12px;
        }

        .scheme-card p {
            color: #647187;
            font-size: 14px;
            line-height: 1.6;
            margin-bottom: 15px;
        }

        .scheme-btn {
            display: inline-block;
            background: #1c5797;
            color: white;
            padding: 10px 15px;
            border: none;
            border-radius: 7px;
            text-decoration: none;
            cursor: pointer;
            font-size: 14px;
        }

        .scheme-btn:hover {
            background: #123d70;
        }

        .scheme-empty {
            display: none;
            text-align: center;
            padding: 30px;
            color: #68758a;
        }

        .scheme-modal {
            display: none;
            position: fixed;
            z-index: 1000;
            inset: 0;
            background: rgba(0, 0, 0, 0.6);
            overflow-y: auto;
            padding: 25px 12px;
        }

        .scheme-modal-content {
            background: white;
            width: 95%;
            max-width: 700px;
            margin: 30px auto;
            padding: 25px;
            border-radius: 12px;
            position: relative;
        }

        .scheme-close {
            position: absolute;
            top: 12px;
            right: 18px;
            font-size: 28px;
            border: none;
            background: none;
            cursor: pointer;
            color: #52627a;
        }

        .scheme-modal-content h2 {
            color: #173b70;
            margin: 10px 35px 20px 0;
        }

        .scheme-detail-section {
            margin: 18px 0;
            padding-bottom: 12px;
            border-bottom: 1px solid #e5eaf1;
        }

        .scheme-detail-section h3 {
            color: #24579b;
            font-size: 16px;
            margin-bottom: 7px;
        }

        .scheme-detail-section p {
            color: #52627a;
            line-height: 1.6;
            font-size: 14px;
        }

        .scheme-actions {
            margin-top: 20px;
        }

        @media (max-width: 600px) {
            .scheme-container {
                width: 94%;
                margin: 22px auto;
            }

            .scheme-header h1 {
                font-size: 25px;
            }

            .scheme-modal-content {
                padding: 20px;
            }
        }
    </style>
</head>

<body>

    <div class="scheme-container">

        <p class="scheme-count" id="schemeCount"></p>

        <div class="scheme-grid" id="schemeGrid"></div>

        <div class="scheme-empty" id="schemeEmpty">

        </div>

    </div>

    <div class="scheme-modal" id="schemeModal">

        <div class="scheme-modal-content">

        function renderSchemes() {
            const grid = document.getElementById("schemeGrid");

            const search = document.getElementById("schemeSearch")
                .value.toLowerCase();

            const region = document.getElementById("regionFilter").value;
            const category = document.getElementById("categoryFilter").value;

            grid.innerHTML = "";

            const filtered = schemes.filter((s) => {
                const matchesSearch =
                    s.name.toLowerCase().includes(search) ||
                    s.purpose.toLowerCase().includes(search) ||
                    s.category.toLowerCase().includes(search) ||
                    s.eligibility.toLowerCase().includes(search);

                const matchesRegion =
                    region === "all" || s.region === region;

                const matchesCategory =
                    category === "all" || s.category === category;

                return matchesSearch && matchesRegion && matchesCategory;
            });

            document.getElementById("schemeCount").textContent =
                "Showing " + filtered.length + " government schemes";

            document.getElementById("schemeEmpty").style.display =
                filtered.length === 0 ? "block" : "none";

            filtered.forEach((s) => {
                const card = document.createElement("div");
                card.className = "scheme-card";

                const heading = document.createElement("h3");
                heading.textContent = s.name;

                const tag = document.createElement("span");
                tag.className = "scheme-tag";
                tag.textContent = s.region + " | " + s.category;

                const description = document.createElement("p");
                description.textContent = s.purpose;

                const button = document.createElement("button");
                button.className = "scheme-btn";
                button.textContent = "View Full Details";

                button.addEventListener("click", () => showScheme(s));

                card.append(heading, tag, description, button);
                grid.appendChild(card);
            });
        }

        function showScheme(s) {
            const details = document.getElementById("schemeDetails");

            details.innerHTML = "";

            const heading = document.createElement("h2");
            heading.textContent = s.name;
            details.appendChild(heading);

            const sections = [
                ["Government", s.region],
                ["Category", s.category],
                ["Why was this scheme introduced?", s.purpose],
                ["Who is eligible?", s.eligibility],
                ["Benefits", s.benefits],
                ["Required Documents", s.documents],
                ["How to Apply", s.apply]
            ];

            sections.forEach(([title, value]) => {
                const section = document.createElement("div");
                section.className = "scheme-detail-section";

                const sectionHeading = document.createElement("h3");
                sectionHeading.textContent = title;

                const paragraph = document.createElement("p");
                paragraph.textContent = value;

                section.append(sectionHeading, paragraph);
                details.appendChild(section);
            });

            const actions = document.createElement("div");
            actions.className = "scheme-actions";

            const link = document.createElement("a");
            link.className = "scheme-btn";
            link.textContent = "Official Information / Apply";
            link.href = s.url;
            link.target = "_blank";
            link.rel = "noopener noreferrer";

            actions.appendChild(link);
            details.appendChild(actions);

            document.getElementById("schemeModal").style.display = "block";
        }

        function closeScheme() {
            document.getElementById("schemeModal").style.display = "none";
        }

        document.getElementById("schemeSearch")
            .addEventListener("input", renderSchemes);

        document.getElementById("categoryFilter")
            .addEventListener("change", renderSchemes);

        document.getElementById("schemeModal")
            .addEventListener("click", function(event) {
