    <style>

        }

        }

        header {
            background: #173b70;

        }

        header h1 {

        }

        header p {
            margin-top: 8px;
            color: #dce8fa;
        }

        .container {
            width: 90%;
            max-width: 1200px;
            margin: 30px auto;
        }

        .back-link {
            display: inline-block;
            margin-bottom: 20px;
            color: #1764b1;
            text-decoration: none;
            font-weight: bold;
        }

        .filter-box, .details-box {
            background: white;
            padding: 22px;
            border-radius: 12px;
            margin-bottom: 25px;
            box-shadow: 0 3px 12px #0000000d;
        }

        .filter-box h2 {
            margin-bottom: 15px;
        }

        .filters {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(190px, 1fr));
            gap: 12px;
        }

        input, select {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccd5e2;
            border-radius: 7px;
            font-size: 14px;
        }

        button, .view-btn {
            background: #1764b1;
            color: white;
            border: none;
            padding: 11px 17px;
            border-radius: 7px;
            cursor: pointer;
            text-decoration: none;
            display: inline-block;
        }

        button:hover, .view-btn:hover {
            background: #10477f;
        }

        .section-title {
            margin: 25px 0 18px;
        }

        .exam-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 18px;
        }

        .exam-card {
            background: white;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 3px 12px #0000000d;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .exam-card h3 {
            color: #173b70;
            font-size: 19px;
        }

        .category {
            color: #1764b1;
            font-size: 13px;
            font-weight: bold;
        }

        .exam-card p {
            color: #596579;
            line-height: 1.5;
            font-size: 14px;
        }

        .view-btn {
            align-self: flex-start;
            margin-top: auto;
        }

        .details-box h2 {
            color: #173b70;
            margin-bottom: 10px;
        }

        .details-box > p {
            color: #596579;
            line-height: 1.6;
            margin-bottom: 15px;
        }

        .detail-item {
            padding: 14px 0;
            border-bottom: 1px solid #e5eaf1;
        }

        .detail-item:last-child {
            border-bottom: none;
        }

        .detail-item h3 {
            color: #174d91;
            font-size: 16px;
            margin-bottom: 7px;
        }

        .detail-item p {
            color: #475569;
            line-height: 1.6;
            font-size: 14px;
            overflow-wrap: anywhere;
        }

        .official-link {
            color: #1764b1;
            font-weight: bold;
        }

        .notice {
            background: #fff7df;
            padding: 14px;
            margin-top: 18px;
            border-left: 4px solid #e5a000;
            color: #72530a;
            line-height: 1.5;
            font-size: 13px;
        }

        .empty-message {
            background: white;
            padding: 25px;
            border-radius: 10px;
            text-align: center;
            color: #64748b;
        }

        @media(max-width: 600px) {
            .container {
                width: 92%;
            }

            header {
                padding: 20px 5%;
            }
        }
    </style>
</head>

// PART 5C DISPLAY FUNCTIONS WILL BE ADDED HERE
function displayExams() {
    const searchValue = document
        .getElementById("searchInput")
        .value.toLowerCase();

    const selectedCategory = document
        .getElementById("categoryFilter")
        .value;

    const examCards = document.getElementById("examCards");

    const filteredExams = exams.filter(exam => {
        const matchesName = exam.name
            .toLowerCase()
            .includes(searchValue);

        const matchesCategory =
            selectedCategory === "" ||
            exam.category === selectedCategory;

        return matchesName && matchesCategory;
    });

    examCards.innerHTML = "";

    if (filteredExams.length === 0) {
        examCards.innerHTML = "<p>No exams found.</p>";
        return;
    }

    filteredExams.forEach(exam => {
        const originalIndex = exams.indexOf(exam);

        examCards.innerHTML += `
            <div class="exam-card">
                <h3>${exam.name}</h3>
                <p><strong>Category:</strong> ${exam.category}</p>
                <p>${exam.purpose}</p>

                <button onclick="viewExam(${originalIndex})">
                    View Details
                </button>
            </div>
        `;
    });
}function viewExam(index) {
    const exam = exams[index];

    if (!exam) return;

    document.getElementById("examCards").style.display = "none";

    const details = document.getElementById("examDetails");

    details.style.display = "block";

    details.innerHTML = `
        <h2>${exam.name}</h2>

        <p><strong>Category:</strong> ${exam.category}</p>

        <p><strong>Purpose:</strong> ${exam.purpose}</p>

        <p><strong>Eligibility:</strong> ${exam.eligibility}</p>

        <p><strong>Educational Qualification:</strong> ${exam.qualification}</p>

        <p><strong>Age Limit:</strong> ${exam.age}</p>

        <p><strong>Subjects:</strong> ${exam.subjects}</p>

        <p><strong>Exam Pattern:</strong> ${exam.pattern}</p>

        <p><strong>Selection Process:</strong> ${exam.selection}</p>

        <p><strong>Conducting Authority:</strong> ${exam.authority}</p>

        <p>
            <strong>Official Website:</strong>
            <a href="${exam.website}" target="_blank" rel="noopener noreferrer">
                Visit Official Website
            </a>
        </p>

        <button onclick="backToExams()">Back to Exams</button>
    `;
}
function backToExams() {
    document.getElementById("examDetails").style.display = "none";
    document.getElementById("examCards").style.display = "grid";
}

displayExams();

</script>
