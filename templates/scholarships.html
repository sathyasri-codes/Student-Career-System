<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scholarships | StudentGuide</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">

    <style>
        .sch-page {
            max-width: 1200px;
            margin: auto;
            padding: 35px 20px 60px;
            color: #172554;
        }

        .sch-heading {
            text-align: center;
            padding: 35px 15px;
            background: linear-gradient(120deg, #2457D6, #55B9F5);
            color: white;
            border-radius: 18px;
            margin-bottom: 25px;
        }

        .sch-heading h1 { margin-bottom: 10px; }

        .sch-controls {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            margin: 25px 0;
        }

        .sch-controls input, .sch-controls select {
            flex: 1;
            min-width: 200px;
            padding: 13px;
            border: 1px solid #cbdcf5;
            border-radius: 9px;
            background: white;
            color: #172554;
        }

        .sch-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
            gap: 20px;
        }

        .sch-card {
            background: white;
            border: 1px solid #dbeafe;
            border-radius: 15px;
            padding: 22px;
            box-shadow: 0 5px 18px rgba(36,87,214,.09);
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .sch-card h3 { color: #2457D6; margin: 0; }

        .sch-tag {
            display: inline-block;
            background: #eaf3ff;
            color: #2457D6;
            padding: 6px 10px;
            border-radius: 20px;
            font-size: 12px;
            width: fit-content;
        }

        .sch-card p { margin: 0; line-height: 1.6; }

        .sch-btn {
            display: inline-block;
            border: 0;
            border-radius: 8px;
            background: linear-gradient(120deg, #2457D6, #55B9F5);
            color: white;
            padding: 11px 16px;
            cursor: pointer;
            font-weight: 600;
            text-decoration: none;
            text-align: center;
        }

        .sch-btn:hover { opacity: .9; }

        .sch-modal {
            display: none;
            position: fixed;
            inset: 0;
            z-index: 9999;
            background: rgba(10, 25, 55, .65);
            padding: 20px;
            overflow-y: auto;
        }

        .sch-modal-content {
            background: white;
            max-width: 750px;
            margin: 35px auto;
            border-radius: 16px;
            padding: 28px;
            position: relative;
            color: #172554;
        }

        .sch-close {
            position: absolute;
            top: 12px;
            right: 18px;
            border: none;
            background: none;
            font-size: 28px;
            cursor: pointer;
            color: #2457D6;
        }

        .sch-detail-section {
            padding: 13px 0;
            border-bottom: 1px solid #e2eaf5;
        }

        .sch-detail-section h3 {
            color: #2457D6;
            margin-bottom: 7px;
        }

        .sch-detail-section p {
            line-height: 1.7;
            margin: 0;
        }

        .sch-actions {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-top: 20px;
        }

        .sch-empty {
            text-align: center;
            padding: 30px;
            color: #64748b;
            display: none;
        }

        @media(max-width: 600px) {
            .sch-page { padding: 20px 12px; }
            .sch-modal-content { padding: 22px 16px; }
        }
    </style>
</head>

<body>

<div class="sch-page">

    <section class="sch-heading">
        <h1>Available Scholarships</h1>
        <p>Explore scholarships in India and other countries.
           Understand eligibility, benefits and application requirements.</p>
    </section>

    <div class="sch-controls">
        <input type="search" id="schSearch"
               placeholder="Search scholarship name...">

        <select id="countryFilter">
            <option value="India">India</option>
        </select>

        <select id="levelFilter">
            <option value="all">All Education Levels</option>
            <option value="School">School</option>
            <option value="Undergraduate">Undergraduate</option>
            <option value="Postgraduate">Postgraduate</option>
            <option value="Research">Research</option>
        </select>
    </div>

    <h2>Scholarship Opportunities</h2>
    <p id="schCount"></p>

    <div class="sch-grid" id="schGrid"></div>

    <div class="sch-empty" id="schEmpty">
        No matching scholarships found. Try another search.
    </div>

</div>

<div class="sch-modal" id="schModal">
    <div class="sch-modal-content">
        <button class="sch-close" onclick="closeScholarship()"
                aria-label="Close">&times;</button>
        <div id="schDetails"></div>
    </div>
</div>

function renderScholarships() {
    const grid = document.getElementById("schGrid");
    const search = document.getElementById("schSearch").value.toLowerCase();
    const country = document.getElementById("countryFilter").value;
    const level = document.getElementById("levelFilter").value;

    grid.innerHTML = "";

    const filtered = scholarships.filter((s) => {
        const matchesSearch =
            s.name.toLowerCase().includes(search) ||
            s.category.toLowerCase().includes(search) ||
            s.purpose.toLowerCase().includes(search);

        const matchesCountry = country === "all" || s.country === country;
        const matchesLevel = level === "all" || s.level === level;

        return matchesSearch && matchesCountry && matchesLevel;
    });

    document.getElementById("schCount").textContent =
        "Showing " + filtered.length + " scholarship opportunities";

    document.getElementById("schEmpty").style.display =
        filtered.length === 0 ? "block" : "none";

    filtered.forEach((s) => {
        const index = scholarships.indexOf(s);

        const card = document.createElement("div");
        card.className = "sch-card";

        const heading = document.createElement("h3");
        heading.textContent = s.name;

        const tag = document.createElement("span");
        tag.className = "sch-tag";
        tag.textContent = s.country + " | " + s.level;

        const description = document.createElement("p");
        description.textContent = s.purpose;

        const button = document.createElement("button");
        button.className = "sch-btn";
        button.textContent = "View Full Details";
        button.addEventListener("click", () => showScholarship(index));

        card.append(heading, tag, description, button);
        grid.appendChild(card);
    });
}

function showScholarship(index) {
    const s = scholarships[index];

    document.getElementById("schDetails").innerHTML = `
        <h2>${s.name}</h2>

        <div class="sch-detail-section">
            <h3>Country</h3>
            <p>${s.country}</p>
        </div>

        <div class="sch-detail-section">
            <h3>Education Level</h3>
            <p>${s.level}</p>
        </div>

        <div class="sch-detail-section">
            <h3>Purpose</h3>
            <p>${s.purpose}</p>
        </div>

        <div class="sch-detail-section">
            <h3>Eligibility</h3>
            <p>${s.eligibility}</p>
        </div>

        <div class="sch-detail-section">
            <h3>Marks Required</h3>
            <p>${s.marks}</p>
        </div>

        <div class="sch-detail-section">
            <h3>Entrance Test</h3>
            <p>${s.test}</p>
        </div>

        <div class="sch-detail-section">
            <h3>Benefits</h3>
            <p>${s.benefit}</p>
        </div>

        <div class="sch-detail-section">
            <h3>Required Documents</h3>
            <p>${s.documents}</p>
        </div>

        <div class="sch-actions">
            <a class="sch-btn" href="${s.url}" target="_blank" rel="noopener noreferrer">
                Official Information / Apply
            </a>
        </div>
    `;

    document.getElementById("schModal").style.display = "block";
}

function closeScholarship() {
    document.getElementById("schModal").style.display = "none";
}

document.getElementById("schSearch").addEventListener("input", renderScholarships);
document.getElementById("countryFilter").addEventListener("change", renderScholarships);
document.getElementById("levelFilter").addEventListener("change", renderScholarships);

document.getElementById("schModal").addEventListener("click", function(event) {
    if (event.target === this) {
        closeScholarship();
    }
});

renderScholarships();
</script>

</body>
</html>
